name: Build MicroBlocks WebApp

on:
  push:
    branches: [ test-rmt-onewire ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-webapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10

      - name: Verify toolchain
        run: |
          emcc -v
          python3 --version
          node --version
          bash --version

      - name: Show repo tree
        run: |
          pwd
          ls -lah
          ls -lah chromeApp || true
          ls -lah chromeApp/emscripten || true

      - name: Make build script executable
        run: chmod +x chromeApp/emscripten/buildEmcc.sh

      - name: Build webapp
        working-directory: chromeApp/emscripten
        shell: bash
        run: ./buildEmcc.sh

      - name: Check outputs
        run: |
          ls -lah chromeApp/webapp || true
          ls -lah chromeApp/MicroBlocks || true

      - name: Upload webapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: microblocks-webapp
          path: |
            chromeApp/webapp/gp_wasm.js
            chromeApp/webapp/gp_wasm.wasm
            chromeApp/webapp/gp_wasm.data
          if-no-files-found: error

      - name: Upload MicroBlocks artifact
        uses: actions/upload-artifact@v4
        with:
          name: microblocks-microblocks-dir
          path: |
            chromeApp/MicroBlocks/gp_wasm.js
            chromeApp/MicroBlocks/gp_wasm.wasm
            chromeApp/MicroBlocks/gp_wasm.data
          if-no-files-found: error